<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamFlix</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #0b0b0f; color: #e8e8ee;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem;
  }
  main { max-width: 34rem; text-align: center; }
  .logo { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.02em; }
  .logo span { color: #e50914; }
  p.tag { margin-top: 0.8rem; font-size: 1.15rem; color: #b9b9c6; }
  p.desc { margin-top: 1.6rem; line-height: 1.7; color: #8f8f9e; }
  a { color: #e50914; text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 2.4rem; font-size: 0.85rem; color: #5c5c6a; }
</style>
</head>
<body>
<main>
  <div class="logo">Stream<span>Flix</span></div>
  <p class="tag">נגן מדיה אישי לאנדרואיד</p>
  <p class="desc">
    אפליקציית צפייה פרטית לשימוש אישי ומשפחתי. כל נתוני הצפייה נשמרים
    במכשיר שלך, עם אפשרות לסנכרון בין המכשירים שלך דרך חשבון Google Drive
    הפרטי שלך — ללא שרתים חיצוניים וללא איסוף מידע.
  </p>
  <p class="desc"><a href="privacy/">מדיניות פרטיות · Privacy Policy</a></p>
  <footer>StreamFlix · אפליקציה פרטית לשימוש אישי</footer>
</main>
</body>
</html>
